name: LLMOps Quality Gates

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: llmops-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prompt-regression:
    name: Prompt Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Regression Gate Tests
        run: |
          python -m pytest \
            tests/test_regression_thresholds.py \
            tests/test_compare_prompts.py \
            tests/test_compare_prompts_import.py \
            tests/test_retrieval_gate.py \
            -q

      - name: Create Deterministic Experiment Results
        run: |
          mkdir -p evaluator/results

          cat > evaluator/results/ci_experiment_results.json <<'JSON'
          {
            "experiments": [
              {
                "config": {
                  "name": "approved_baseline",
                  "prompt_version": "v1",
                  "use_rag": false,
                  "model": "offline-test-model"
                },
                "average_overall_score": 0.90,
                "average_latency_ms": 100.0,
                "estimated_total_cost_usd": 0.001
              },
              {
                "config": {
                  "name": "candidate_prompt",
                  "prompt_version": "v2",
                  "use_rag": false,
                  "model": "offline-test-model"
                },
                "average_overall_score": 0.92,
                "average_latency_ms": 105.0,
                "estimated_total_cost_usd": 0.00105
              }
            ]
          }
          JSON

      - name: Run Prompt Regression Gate
        shell: bash
        run: |
          set -o pipefail

          python -m evaluator.compare_prompts \
            --baseline approved_baseline \
            --candidate candidate_prompt \
            --results-file evaluator/results/ci_experiment_results.json \
            | tee evaluator/results/prompt_regression_report.txt

      - name: Upload Prompt Evaluation Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prompt-regression-results
          path: |
            evaluator/results/ci_experiment_results.json
            evaluator/results/prompt_regression_report.txt
          retention-days: 14

  rag-retrieval:
    name: RAG Retrieval Gate
    runs-on: ubuntu-latest

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify OpenAI API Key
        shell: bash
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY GitHub secret is not configured."
            exit 1
          fi

          echo "OPENAI_API_KEY is configured."

      - name: Build RAG Vector Store
        run: |
          rm -rf rag/vector_store
          python -m rag.ingest

      - name: Run RAG Retrieval Quality Gate
        shell: bash
        run: |
          set -o pipefail

          mkdir -p evaluator/results

          python -m evaluator.evaluate_retrieval \
            | tee evaluator/results/retrieval_gate_report.txt

      - name: Upload Retrieval Evaluation Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rag-retrieval-results
          path: |
            evaluator/results/retrieval_evaluation.json
            evaluator/results/retrieval_gate_report.txt
          if-no-files-found: warn
          retention-days: 14
