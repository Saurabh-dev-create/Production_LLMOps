name: LLM Evaluation Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  evaluate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Run all unit tests, including:
      # - Schema validation tests
      # - Safety guardrail tests
      # - Prompt tests
      # - Evaluation tests
      - name: Run Unit Tests
        run: pytest

      # Execute benchmark evaluation
      - name: Run Evaluation
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python -m evaluator.run_evaluation

      # Generate human-readable Markdown report
      - name: Generate Markdown Report
        run: python -m evaluator.generate_report

      # Enforce minimum quality threshold
      - name: Check Quality Thresholds
        run: python -m evaluator.check_thresholds

      # Upload reports as artifacts
      - name: Upload Evaluation Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-results
          path: evaluator/results/